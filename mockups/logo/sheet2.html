<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>body{margin:0;padding:20px;background:#f1f4ef;font-family:"Pretendard Variable",sans-serif;color:#16231c}
.col{background:#fff;border-radius:20px;padding:18px;margin-bottom:16px}
.h{font-weight:800;font-size:20px;margin-bottom:10px}.r{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{width:150px}.m{width:48px}.sm{width:24px}.wide{width:380px}
.phone{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border:1px solid #d6ded6;border-radius:14px;font-weight:800;color:#2c6a45}
.phone img{width:30px}
.home{display:flex;gap:14px;margin-top:12px;padding:14px;background:#2a3340;border-radius:16px}.app{width:56px;text-align:center;color:#fff;font-size:11px}.app img{width:56px;display:block;margin-bottom:4px;border-radius:14px}
.ghost{width:56px;height:56px;border-radius:14px;background:#4a5566;display:block;margin-bottom:4px}</style></head><body>
<div class=col><div class=h>시안 1</div><div class=r><img class=big src=logo-1.svg><img class=m src=logo-1.svg><img class=sm src=logo-1.svg><img class=wide src=logo-1-wide.svg></div><div class=phone><img src=logo-1.svg>모두의 올팍</div><div class=home><div class=app><span class=ghost></span>카메라</div><div class=app><img src=logo-1.svg>모두의 올팍</div><div class=app><span class=ghost></span>지도</div></div></div>
<div class=col><div class=h>시안 2</div><div class=r><img class=big src=logo-2.svg><img class=m src=logo-2.svg><img class=sm src=logo-2.svg><img class=wide src=logo-2-wide.svg></div><div class=phone><img src=logo-2.svg>모두의 올팍</div><div class=home><div class=app><span class=ghost></span>카메라</div><div class=app><img src=logo-2.svg>모두의 올팍</div><div class=app><span class=ghost></span>지도</div></div></div>
<div class=col><div class=h>시안 1+2</div><div class=r><img class=big src=logo-5.svg><img class=m src=logo-5.svg><img class=sm src=logo-5.svg><img class=wide src=logo-5-wide.svg></div><div class=phone><img src=logo-5.svg>모두의 올팍</div><div class=home><div class=app><span class=ghost></span>카메라</div><div class=app><img src=logo-5.svg>모두의 올팍</div><div class=app><span class=ghost></span>지도</div></div></div>
</body></html>
