  <title id="title">모두의 올팍 — 호수를 품은 섬 가로형 로고</title>
  <desc id="desc">호수가 초록 섬을 둥글게 감싸는 형태로 공원이 모두를 품어 주는 편안함을 표현합니다. 아이콘 오른쪽에 모두의 올팍 로고타입을 배치합니다.</desc>
