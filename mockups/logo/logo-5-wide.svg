  <title id="title">모두의 올팍 — 나무 아래 호수 섬 가로형 로고</title>
  <desc id="desc">나홀로나무와 넓은 언덕, 아래로 흐르는 호수의 곡선으로 누구나 쉬어 갈 수 있는 나들이의 중심을 표현합니다. 아이콘 오른쪽에 모두의 올팍 로고타입을 배치합니다.</desc>
